services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin in .env}
      DATABASE_PATH: /app/data/accounts.sqlite
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - exchange-data:/app/data
volumes:
  exchange-data:
